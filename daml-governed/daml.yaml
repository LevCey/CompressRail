# CompressRail's cycle execution as a Decentralization Manager governed action.
#
# Depends on the compressrail model and on the governance-action-v1 interface,
# which `./vendor.sh` fetches (the released DAR, SHA-256 checked) into `.vendor/`.
# Templates only; the tests live in `test/`.
sdk-version: 3.5.1
name: compressrail-governed
version: 0.0.1
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../daml/.daml/dist/compressrail-0.0.3.dar
  - .vendor/governance-action-v1-0.1.0.dar
build-options:
  - -Wno-upgrade-interfaces
